# =============================================================================
# Nginx — andproducciones.com  (copia versionada de
# /etc/nginx/sites-available/andproducciones.conf)
#
# Generado por deploy/deploy.sh — el marcador __CSP_SCRIPT_HASHES__ lo sustituye
# el script con los sha256 de los <script> inline de index.html. Si editas el
# JS de la página a mano en el servidor, el CSP la romperá: vuelve a desplegar.
#
# Habilitar:  sudo ln -s /etc/nginx/sites-available/andproducciones.conf /etc/nginx/sites-enabled/
# Validar:    sudo nginx -t
# Recargar:   sudo systemctl reload nginx
#
# El gzip vive en /etc/nginx/conf.d/optimizations.conf. No duplicarlo aquí.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name andproducciones.com www.andproducciones.com;

    # El reto ACME va ANTES del redirect: con un `return 301` a nivel de server,
    # nginx contesta la redirección sin mirar las locations y la renovación falla.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# www -> apex, para que el sitio tenga una sola URL canónica.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.andproducciones.com;

    ssl_certificate     /etc/letsencrypt/live/andproducciones.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andproducciones.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://andproducciones.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name andproducciones.com;

    ssl_certificate     /etc/letsencrypt/live/andproducciones.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andproducciones.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:andprod_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Sin ssl_stapling: Let's Encrypt dejó de publicar OCSP responder en sus
    # certificados, así que nginx solo avisaba de que lo ignoraba.

    server_tokens off;
    root /var/www/andproducciones;
    index index.html;

    # La página va en UTF-8 y está llena de acentos: sin esto nginx sirve
    # text/html a secas y el navegador tiene que fiarse del <meta charset>.
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml application/manifest+json;

    client_max_body_size 1m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # -------------------------------------------------------------------------
    # Cabeceras de seguridad.
    #
    # OJO con add_header en nginx: un `location` que declara su propio add_header
    # NO hereda ninguno de este nivel. Por eso los bloques de assets de abajo
    # repiten las que importan en su contexto.
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           DENY                                  always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin                          always;

    # El sitio es un HTML autocontenido: no carga nada de terceros, así que el
    # CSP puede ser estricto. Los estilos necesitan 'unsafe-inline' porque hay
    # atributos style="" en el marcado (los hashes no cubren atributos); el JS
    # va por hash, sin 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'none'; script-src __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # El HTML se revalida siempre: un cambio de copy o de teléfono tiene que
    # verse ya, no cuando al navegador le parezca.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # Las fuentes llevan el subset en el nombre y no cambian nunca: se cachean
    # un año. Si algún día cambian, cambia el nombre del archivo.
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /site.webmanifest { default_type application/manifest+json; }
    location = /robots.txt       { access_log off; }
    location = /sitemap.xml      { }

    # Una sola página: cualquier ruta desconocida vuelve al inicio en vez de
    # enseñar el 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nada de ficheros ocultos (.git, .env y compañía) por si alguna vez
    # alguien copia el repo entero a la raíz web.
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
