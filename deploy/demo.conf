# =============================================================================
# Nginx — plantilla de los demos de Poryectosdemo/ (copia versionada de
# /etc/nginx/sites-available/<demo>.conf).
#
# La instala deploy/deploy-demo.sh sustituyendo estos marcadores:
#   __DOMAIN__               p.ej. agave.andproducciones.com
#   __WEBROOT__              p.ej. /var/www/agave
#   __CSP_SCRIPT_HASHES__    sha256 de los <script> inline del HTML
#
# Igual que en la landing, el CSP va por hash: editar el JS del demo a mano en
# el servidor lo deja sin JavaScript. Se despliega con el script y punto.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # El reto ACME va ANTES del redirect: con un `return 301` a nivel de server
    # nginx contesta la redirección sin mirar las locations y la renovación falla.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root __WEBROOT__;
    index index.html;

    # El demo va en UTF-8 y está lleno de acentos.
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml;

    client_max_body_size 1m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # El HTML lleva las fotos en base64: sin gzip son ~1 MB por visita.
    gzip on;
    # text/html ya lo comprime nginx siempre que gzip está on: declararlo avisa de duplicado.
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # Cabeceras. OJO: un `location` con su propio add_header NO hereda ninguna
    # de este nivel, por eso los bloques de abajo repiten las que importan.
    #
    # Es una demo de cliente, no contenido del sitio: noindex para que no
    # compita en buscadores con andproducciones.com.
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000"                   always;
    add_header X-Content-Type-Options    nosniff                              always;
    add_header X-Frame-Options           DENY                                 always;
    add_header Referrer-Policy           strict-origin-when-cross-origin      always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header X-Robots-Tag              "noindex, nofollow"                  always;

    # Los demos son HTML autocontenidos salvo por lo de Google: las fuentes
    # (fonts.googleapis.com + fonts.gstatic.com) y el mapa embebido
    # (www.google.com/maps?output=embed). El JS inline va por hash.
    add_header Content-Security-Policy "default-src 'none'; script-src __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # El demo se va tocando: el HTML se revalida siempre.
    add_header Cache-Control "no-cache" always;

    location ~* \.(?:png|svg|jpe?g|webp|avif|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location = /robots.txt { access_log off; }

    # Una sola página: cualquier ruta desconocida vuelve al inicio.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
